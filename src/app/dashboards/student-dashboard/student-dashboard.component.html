<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-body p-5 text-center">

            <h1 class="mb-4 text-primary">
                Student Dashboard
            </h1>

            <h3>
                Welcome,
                {{ user?.vch_name }}
            </h3>

            <p class="mt-3">
                Email:
                {{ user?.vch_email }}
            </p>

            <p>
                Role: {{ user?.int_role == 1 ? 'Teacher' : 'Student' }}
            </p>

            <button
                class="btn btn-danger mt-3"
                (click)="logout()"
            >
                Logout
            </button>

        </div>

    </div>

</div>
